name: ziper-local
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ziper_admin
      POSTGRES_DB: ziper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local-setup.sh first}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/local-setup.sh first}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run scripts/local-setup.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziper_admin -d ziper"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: ${ZIPER_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_JDBC_URL: jdbc:postgresql://db:5432/ziper
      DB_USERNAME: ziper_app
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/local-setup.sh first}
      MIGRATION_JDBC_URL: jdbc:postgresql://db:5432/ziper
      MIGRATION_USERNAME: ziper_migrator
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run scripts/local-setup.sh first}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Run scripts/local-setup.sh first}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  postgres-data:
