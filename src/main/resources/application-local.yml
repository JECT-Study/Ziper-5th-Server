spring:
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/ziper}
    username: ${DB_USERNAME:ziper_app}
    password: ${DB_PASSWORD}
  flyway:
    url: ${MIGRATION_JDBC_URL:${DB_JDBC_URL:jdbc:postgresql://localhost:5432/ziper}}
    user: ${MIGRATION_USERNAME:ziper_migrator}
    password: ${MIGRATION_PASSWORD}
app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
sentry:
  enabled: ${SENTRY_ENABLED:false}
  environment: ${SENTRY_ENVIRONMENT:local}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
