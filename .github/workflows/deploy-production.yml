name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@efc751f0cb72837261f913274a27a621e72b094d
    with:
      infra_sha: efc751f0cb72837261f913274a27a621e72b094d
    secrets: inherit
