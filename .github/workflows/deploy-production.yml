name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@f62bf2268c4a2c969ebcede2673095e7c9b4d5da
    with:
      infra_sha: f62bf2268c4a2c969ebcede2673095e7c9b4d5da
    secrets: inherit
