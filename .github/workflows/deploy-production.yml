name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@bb929769d23b60ca2990812c6a2f80e22b444d53
    with:
      infra_sha: bb929769d23b60ca2990812c6a2f80e22b444d53
    secrets: inherit
