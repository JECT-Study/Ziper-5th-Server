name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@7f2a94286a83c3079303957b4f330cd80897b201
    with:
      infra_sha: 7f2a94286a83c3079303957b4f330cd80897b201
    secrets: inherit
