name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@e289b2ee569141cef3b7a35d5178657d267b25b6
    with:
      infra_sha: e289b2ee569141cef3b7a35d5178657d267b25b6
    secrets: inherit
