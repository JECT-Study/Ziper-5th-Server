name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@4a0e5b1d71c7107a6b8200d1fe6ab02547041135
    with:
      infra_sha: 4a0e5b1d71c7107a6b8200d1fe6ab02547041135
    secrets: inherit
