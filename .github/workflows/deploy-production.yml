name: Deploy production manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
concurrency:
  group: ziper-production
  cancel-in-progress: false
jobs:
  home:
    if: github.ref == 'refs/heads/main'
    uses: JECT-Study/Ziper-5th-Infra/.github/workflows/deploy-home.yml@9f799a620df2857e7d84f9ec7b5b2c738fac5e85
    with:
      infra_sha: 9f799a620df2857e7d84f9ec7b5b2c738fac5e85
    secrets: inherit
