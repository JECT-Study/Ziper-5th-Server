name: Upload Sentry source context
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: sentry-source-upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release and upload matching source context
        env:
          SENTRY_UPLOAD: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          test -n "$SENTRY_AUTH_TOKEN"
          ./gradlew bootJar
          mkdir -p build/release
          printf '%s\n' "$SENTRY_RELEASE" > build/release/SENTRY_RELEASE
      - name: Package and verify the same release JAR (no deployment)
        run: |
          docker build --target release --tag ziper-release:${{ github.sha }} .
          python3 scripts/test-release-artifact.py
          python3 scripts/verify-release-artifact.py --image ziper-release:${{ github.sha }}
          docker save ziper-release:${{ github.sha }} | gzip > build/release/image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ziper-server-${{ github.sha }}
          path: |
            build/libs/ziper-server.jar
            build/release/SENTRY_RELEASE
            build/release/image.tar.gz
            build/intermediates/sentry/java/source-bundle/*.zip
          if-no-files-found: error
